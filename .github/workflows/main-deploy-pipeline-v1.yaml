name: Deploy to AWS ECS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to Amazon ECS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::363615071302:role/GitHubActionsOIDCRole
          aws-region: us-east-1

      - name: Terraform outputs
        uses: dflook/terraform-output@v1
        id: terraform-outputs
        with:
          path: terraform

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: v1o5t6h9/galaxybank-api
          IMAGE_TAG: latest
        run: |
          cd Api/
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Deploy service to Amazon ECS
        run: |
          CLUSTER_NAME="${{ steps.terraform-outputs.outputs.ecs_cluster_name }}"
          SERVICE_NAME="${{ steps.terraform-outputs.outputs.ecs_service_name }}"
          aws ecs update-service --cluster $CLUSTER_NAME --service $SERVICE_NAME --force-new-deployment
        env:
          AWS_REGION: af-south-1
