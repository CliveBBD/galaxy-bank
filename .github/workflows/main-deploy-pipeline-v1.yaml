name: Deploy to AWS ECS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to Amazon ECS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::363615071302:role/GitHubActionsOIDCRole
          aws-region: us-east-1

      - name: Terraform outputs
        uses: dflook/terraform-output@v1
        id: terraform-outputs
        with:
          path: terraform

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          REPOSITORY_URL: ${{steps.terraform-outputs.outputs.ecr_repository_url}}
          IMAGE_TAG: latest
          AWS_REGION: af-south-1
        run: |
          cd Api/
          docker build -t $REPOSITORY_URL:$IMAGE_TAG .
          docker push $REPOSITORY_URL:$IMAGE_TAG
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REPOSITORY_URL
          docker push $REPOSITORY_URL:$IMAGE_TAG

      - name: Deploy service to Amazon ECS
        run: |
          CLUSTER_NAME="${{ steps.terraform-outputs.outputs.ecs_cluster_name }}"
          SERVICE_NAME="${{ steps.terraform-outputs.outputs.ecs_service_name }}"
          aws ecs update-service --cluster $CLUSTER_NAME --service $SERVICE_NAME --force-new-deployment
        env:
          AWS_REGION: af-south-1
