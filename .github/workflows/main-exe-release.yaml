name: Build and Release CLI
description: Build and release the CLI application as a self-contained executable for Windows.

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore ./Cli

      - name: Build application
        run: dotnet build ./Cli -c Release --no-restore

      - name: Publish application
        run: dotnet publish ./Cli -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

      - name: Create ZIP archive
        run: Compress-Archive -Path ./publish/* -DestinationPath ./Cli.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./Cli.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
